
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ShopZone online product catalog with search, filters and shopping cart.">
<title>ShopZone | E-commerce Store</title>

<style>
:root {
  --primary: #6c4cf1;
  --background: #f5f6fb;
  --surface: #ffffff;
  --text: #22223a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--background);
  color: var(--text);
}
header {
  background: var(--surface);
  padding: 18px 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  box-shadow: 0 2px 10px #0000000d;
}
.logo { color: var(--primary); font-size: 25px; font-weight: bold; }
nav a {
  color: var(--text);
  text-decoration: none;
  margin: 0 10px;
}
button, select, input {
  font: inherit;
  padding: 10px;
  border-radius: 8px;
}
button {
  cursor: pointer;
  border: none;
  background: var(--primary);
  color: white;
}
button:hover { opacity: .85; }
.hero {
  padding: 55px 7%;
  background: linear-gradient(120deg, #e6ddff, #f8e9ff);
}
.hero h1 { font-size: clamp(30px, 5vw, 48px); margin: 0 0 12px; }
.hero p { line-height: 1.7; }
.controls {
  padding: 25px 7% 5px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.controls input { flex: 1; min-width: 180px; border: 1px solid #ddd; }
.controls select { border: 1px solid #ddd; background: white; }
main { padding: 20px 7% 50px; }
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 22px;
}
.card {
  background: var(--surface);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 18px #0000000c;
  transition: transform .2s;
}
.card:hover { transform: translateY(-4px); }
.card img {
  width: 100%;
  height: 190px;
  object-fit: contain;
  padding: 12px;
  background: white;
}
.card-content { padding: 16px; }
.card h3 { margin-top: 0; }
.price { font-weight: bold; color: var(--primary); font-size: 20px; }
.card button { width: 100%; margin-top: 10px; }
#cart { margin-top: 35px; padding: 20px; background: var(--surface); border-radius: 12px; }
footer { text-align: center; padding: 25px; background: #22223a; color: white; }
#status { min-height: 24px; color: var(--primary); }
@media (max-width: 600px) {
  header { padding: 16px 5%; }
  nav { width: 100%; }
  nav a { margin: 0 12px 0 0; }
  .hero, main { padding-left: 5%; padding-right: 5%; }
  .controls { padding-left: 5%; padding-right: 5%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>

<body>
<header>
  <div class="logo">ShopZone.</div>
  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Find Your Next Favourite.</h1>
  <p>Discover amazing products for your everyday life.</p>
  <a href="#products"><button>Explore Products →</button></a>
</section>

<div class="controls">
  <input id="search" type="search" placeholder="Search products..."
         aria-label="Search products">
  <select id="category" aria-label="Filter by category">
    <option value="All">All Categories</option>
    <option value="Electronics">Electronics</option>
    <option value="Fashion">Fashion</option>
    <option value="Accessories">Accessories</option>
  </select>
  <select id="sort" aria-label="Sort products">
    <option value="default">Default Order</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
  </select>
</div>

<main id="products">
  <h2>Our Products</h2>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="products" id="product-list"></div>

  <section id="cart">
    <h2>🛒 Shopping Cart</h2>
    <div id="cart-items">Your cart is empty.</div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button id="clear-cart">Clear Cart</button>
  </section>
</main>

<footer>
  <p>© 2026 ShopZone. Built as a Web Development Capstone Project.</p>
</footer>

<script>
const products = [
  {id:1, name:"Wireless Headphones", price:1499, category:"Electronics",
   image:"https://placehold.co/400x300/e8e1ff/333333?text=Headphones"},
  {id:2, name:"Smart Watch", price:1999, category:"Electronics",
   image:"https://placehold.co/400x300/e1efff/333333?text=Smart+Watch"},
  {id:3, name:"Running Shoes", price:1299, category:"Fashion",
   image:"https://placehold.co/400x300/ffe9df/333333?text=Shoes"},
  {id:4, name:"Classic Backpack", price:899, category:"Fashion",
   image:"https://placehold.co/400x300/e0f5e9/333333?text=Backpack"},
  {id:5, name:"Sunglasses", price:499, category:"Accessories",
   image:"https://placehold.co/400x300/fff0c9/333333?text=Sunglasses"},
  {id:6, name:"Bluetooth Speaker", price:999, category:"Electronics",
   image:"https://placehold.co/400x300/fce0ed/333333?text=Speaker"}
];

let cart = [];

const productList = document.getElementById("product-list");
const search = document.getElementById("search");
const category = document.getElementById("category");
const sort = document.getElementById("sort");

function renderProducts() {
  let filtered = products.filter(product =>
    product.name.toLowerCase().includes(search.value.toLowerCase()) &&
    (category.value === "All" || product.category === category.value)
  );

  if (sort.value === "low") filtered.sort((a,b) => a.price - b.price);
  if (sort.value === "high") filtered.sort((a,b) => b.price - a.price);

  productList.replaceChildren();

  document.getElementById("status").textContent =
    filtered.length ? `${filtered.length} products found.` : "No products found.";

  filtered.forEach(product => {
    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.src = product.image;
    img.alt = product.name;
    img.loading = "lazy";

    const content = document.createElement("div");
    content.className = "card-content";

    const name = document.createElement("h3");
    name.textContent = product.name;

    const type = document.createElement("p");
    type.textContent = product.category;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = `₹${product.price.toLocaleString("en-IN")}`;

    const button = document.createElement("button");
    button.textContent = "Add to Cart";
    button.addEventListener("click", () => addToCart(product.id));

    content.append(name, type, price, button);
    card.append(img, content);
    productList.append(card);
  });
}

function addToCart(id) {
  const item = cart.find(product => product.id === id);
  if (item) item.quantity++;
  else cart.push({...products.find(product => product.id === id), quantity:1});
  renderCart();
}

function renderCart() {
  const container = document.getElementById("cart-items");
  container.replaceChildren();

  if (!cart.length) {
    container.textContent = "Your cart is empty.";
  }

  cart.forEach(item => {
    const row = document.createElement("p");
    row.textContent = `${item.name} × ${item.quantity} — ₹${item.price * item.quantity} `;

    const remove = document.createElement("button");
    remove.textContent = "Remove";
    remove.addEventListener("click", () => {
      cart = cart.filter(product => product.id !== item.id);
      renderCart();
    });

    row.append(remove);
    container.append(row);
  });

  document.getElementById("cart-count").textContent =
    cart.reduce((sum,item) => sum + item.quantity, 0);

  document.getElementById("total").textContent =
    cart.reduce((sum,item) => sum + item.price * item.quantity, 0)
      .toLocaleString("en-IN");
}

search.addEventListener("input", renderProducts);
category.addEventListener("change", renderProducts);
sort.addEventListener("change", renderProducts);

document.getElementById("clear-cart").addEventListener("click", () => {
  cart = [];
  renderCart();
});

renderProducts();
renderCart();
</script>
</body>
</html>
